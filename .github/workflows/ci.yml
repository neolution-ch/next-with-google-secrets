name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, synchronize, ready_for_review]

# cancel running actions for current PR if new commits were pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset-check:
    name: Changeset Check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Activates the pnpm version pinned in package.json's "packageManager".
      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Check for changesets
        if: github.head_ref != 'changeset-release/main' && !startsWith(github.head_ref,
          'changeset-release/release/')
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

  ci:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      # Activates the pnpm version pinned in package.json's "packageManager".
      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm run prettier-check
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm exec jest
